<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adaptive Task Manager</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="container">

        <!-- =========================
             Header
        ========================== -->
        <header>
            <h1>Adaptive Task Manager</h1>
            <p>Organize your day, one task at a time.</p>
        </header>

        <!-- =========================
             Dashboard
        ========================== -->
        <section class="dashboard">

            <div class="card">
                <h3>Total Tasks</h3>
                <h2 id="totalTasks">0</h2>
            </div>

            <div class="card">
                <h3>Pending Tasks</h3>
                <h2 id="pendingTasks">0</h2>
            </div>

            <div class="card">
                <h3>Completed Tasks</h3>
                <h2 id="completedTasks">0</h2>
            </div>

        </section>

        <!-- =========================
             Task Section
        ========================== -->
        <section class="task-section">

            <div class="section-header">
                <h2>Today's Tasks</h2>
            </div>

            <!-- =========================
                 Live Search
            ========================== -->
            <div class="search-container">

                <div class="search-box">

                    <span class="search-icon">🔍</span>

                    <input
                        type="text"
                        id="taskSearch"
                        placeholder="Search tasks..."
                        autocomplete="off">

                </div>

            </div>

            <div id="taskContainer">

                <div class="empty-task">
                    <p>No tasks available.</p>
                </div>

            </div>

        </section>

    </div>

    <!-- =========================
         Floating Add Button
    ========================== -->
    <button class="add-btn" id="openModal">+</button>

    <!-- =========================
         Add Task Modal
    ========================== -->
    <div class="modal" id="taskModal">

        <div class="modal-content">

            <h2 id="taskModalTitle">Add New Task</h2>

            <input
                type="text"
                id="taskTitle"
                placeholder="Task Title">

            <select id="taskCategory">
                <option>Work</option>
                <option>Personal</option>
                <option>Study</option>
                <option>Health</option>
            </select>

            <select id="taskPriority">
                <option>High</option>
                <option>Medium</option>
                <option>Low</option>
            </select>

            <input
                type="date"
                id="taskDate">

            <div class="modal-buttons">

                <button
                    class="cancel-btn"
                    id="closeModal">
                    Cancel
                </button>

                <button
                    class="save-btn"
                    id="saveTask">
                    Save Task
                </button>

            </div>

        </div>

    </div>

    <!-- =========================
         Delete Confirmation Modal
    ========================== -->
    <div class="modal" id="deleteModal">

        <div class="modal-content delete-modal">

            <h2>Delete Task</h2>

            <p class="delete-message">
                Are you sure you want to delete
                <strong id="deleteTaskTitle">this task</strong>?
            </p>

            <p class="delete-warning">
                This action cannot be undone.
            </p>

            <div class="modal-buttons">

                <button
                    class="cancel-btn"
                    id="cancelDelete">
                    Cancel
                </button>

                <button
                    class="delete-confirm-btn"
                    id="confirmDelete">
                    Delete
                </button>

            </div>

        </div>

    </div>

    <!-- =========================
         Toast Notifications
    ========================== -->
    <div id="toastContainer"></div>

    <!-- =========================
         JavaScript Files
    ========================== -->
    <script src="js/state.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/tasks.js"></script>
    <script src="js/ui.js"></script>

    <!-- =====================================
         Task Manager Module (v0.3+)
    ====================================== -->
    <script src="js/taskManager.js"></script>

    <script src="js/modal.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
